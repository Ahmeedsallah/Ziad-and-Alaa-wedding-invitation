<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ziad & Alaa Wedding Invitation</title>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #fdfbf7;
            color: #333;
            font-family: 'Montserrat', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: #ffffff;
            padding: 50px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            text-align: center;
            max-width: 500px;
            width: 100%;
            border: 1px solid #eae0d5;
        }
        .subtitle {
            font-size: 14px;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #b5838d;
            margin-bottom: 15px;
        }
        .names {
            font-family: 'Great Vibes', cursive;
            font-size: 52px;
            color: #6b705c;
            margin-bottom: 20px;
            line-height: 1.2;
        }
        .description {
            font-size: 15px;
            line-height: 1.6;
            color: #666;
            margin-bottom: 30px;
            font-style: italic;
        }
        .divider {
            width: 60px;
            height: 2px;
            background: #e0a96d;
            margin: 20px auto;
        }
        .details {
            margin-bottom: 30px;
        }
        .details p {
            font-size: 16px;
            color: #444;
            margin: 8px 0;
            font-weight: 500;
        }
        .btn {
            display: inline-block;
            padding: 12px 30px;
            background-color: #6b705c;
            color: #ffffff;
            text-decoration: none;
            border-radius: 25px;
            font-size: 14px;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(107, 112, 92, 0.3);
        }
        .btn:hover {
            background-color: #a5a58d;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="subtitle">Save The Date</div>
        <div class="names">Ziad & Alaa</div>
        <div class="divider"></div>
        
        <p class="description">
            "Hand in hand, step by step, into our forever. Ziad & Alaa are getting married! We can’t wait to celebrate our special day with the people we love most ❤️"
        </p>
        
        <div class="details">
            <p>🗓️ <strong>Date:</strong> [15-8-2026]</p>
            <p>⏰ <strong>Time:</strong> [7PM]</p>
            <p>📍 <strong>Location:</strong> [AMIRA-VALLEY ALMARIOTYA]</p>
        </div>

        <!-- يمكنك تعديل الرابط بوضع رابط موقع القاعة على Google Maps -->
        <a href="https://www.google.com/maps?q=29.965486526489258,31.176525115966797&z=17&hl=en" target="_blank" class="btn">View Location on Map 🗺️</a>
    </div>

</body>
</html>
